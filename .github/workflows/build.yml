name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - name: Giai nen zip
        run: |
          ZIP=$(find . -maxdepth 2 -name '*.zip' | head -n1)
          if [ ! -f settings.gradle ] && [ -n "$ZIP" ]; then
            unzip -o "$ZIP" -x '.github/*' -d .
          fi
      - name: Build
        run: |
          if [ ! -f settings.gradle ]; then
            echo "KHONG TIM THAY settings.gradle. Cac file trong repo:"
            find . -not -path './.git/*' -type f | head -60
            exit 1
          fi
          gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: safeanchor-jar
          path: build/libs/*.jar
